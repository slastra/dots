# Input idle for the TV burn-in guard (2026-09-27). deskpresence owns the TV;
# this only tells it how long since the keyboard or mouse was touched.
#
# Idle inhibitors are ignored on purpose. On 2026-09-26 an app held one from
# 18:32 to 06:29, swayidle never fired, and the OLED stayed lit all night
# while the radar misread the empty desk. A film longer than an hour takes
# `deskpresence hold 3h` (self-expiring), not an inhibitor.
#
#   20 s    quiet   the radar decides (under the 30 s away timer, so input
#                   touched just before leaving cannot hold the TV on)
#   10 min  idle    the radar decides; if the radar is out, off
#   1 h     away    off, whatever the radar says, until input returns
#
# The binary is called by absolute path: the user manager's PATH has no
# ~/go/bin.

general {
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

listener {
    timeout = 20
    ignore_inhibit = true
    on-timeout = /home/shaun/go/bin/deskpresence input quiet
    # unblank: lastshell's blackout shader, should the shell be gone
    on-resume = /home/shaun/go/bin/deskpresence input active; /home/shaun/.config/hypr/scripts/unblank.sh
}

listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = /home/shaun/go/bin/deskpresence input idle
    on-resume = /home/shaun/go/bin/deskpresence input active
}

listener {
    timeout = 3600
    ignore_inhibit = true
    on-timeout = /home/shaun/go/bin/deskpresence input away
    on-resume = /home/shaun/go/bin/deskpresence input active
}

# The watchdog: if deskpresence itself is dead, nothing owns the TV. After
# 10 min without input it blanks the panel; input brings it back.
listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = /home/shaun/.config/hypr/scripts/tv-watchdog.sh idle
    on-resume = /home/shaun/.config/hypr/scripts/tv-watchdog.sh resume
}
