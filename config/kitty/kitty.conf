# Font: the pair tint has applied (`tint look --font`, ~/.config/tint/fonts.toml)
include font.conf

# Emoji in the text color: monochrome Noto Emoji (~/.local/share/fonts,
# variable 300-700) instead of Noto Color Emoji. symbol_map, not a fontconfig
# alias: the font also carries digits, # and *, and fontconfig's generic emoji
# rules rank the color font first even for "Noto Emoji". The map lists only
# what the font has (generated from its cmap): a mapped codepoint it lacks
# draws as a box, and ✓ ✗ sit in the dingbats block it only partly covers.
# Geometric shapes (U+25xx, TUIs' one-cell play/pause marks) stay with the text font.
symbol_map U+231A-U+231B,U+23E9-U+23F3,U+23F8-U+23FA,U+2600-U+2604,U+260E,U+2611,U+2614-U+2615,U+2618,U+261D,U+2620,U+2622-U+2623,U+2626,U+262A,U+262E-U+262F,U+2638-U+263A,U+2640,U+2642,U+2648-U+2653,U+265F-U+2660,U+2663,U+2665-U+2666,U+2668,U+267B,U+267E-U+267F,U+2692-U+2697,U+2699,U+269B-U+269C,U+26A0-U+26A1,U+26A7,U+26AA-U+26AB,U+26B0-U+26B1,U+26BD-U+26BE,U+26C4-U+26C5,U+26C8,U+26CE-U+26CF,U+26D1,U+26D3-U+26D4,U+26E9-U+26EA,U+26F0-U+26F5,U+26F7-U+26FA,U+26FD,U+2702,U+2705,U+2708-U+270D,U+270F,U+2712,U+2714,U+2716,U+271D,U+2721,U+2728,U+2733-U+2734,U+2744,U+2747,U+274C,U+274E,U+2753-U+2755,U+2757,U+2763-U+2764,U+2795-U+2797,U+27A1,U+27B0,U+27BF,U+2B05-U+2B07,U+2B1B-U+2B1C,U+2B50,U+2B55,U+1F004,U+1F0CF,U+1F170-U+1F171,U+1F17E-U+1F17F,U+1F18E,U+1F191-U+1F19A,U+1F1E6-U+1F1FF,U+1F201-U+1F202,U+1F21A,U+1F22F,U+1F232-U+1F23A,U+1F250-U+1F251,U+1F300-U+1F321,U+1F324-U+1F393,U+1F396-U+1F397,U+1F399-U+1F39B,U+1F39E-U+1F3F0,U+1F3F3-U+1F3F5,U+1F3F7-U+1F4FD,U+1F4FF-U+1F53D,U+1F549-U+1F54E,U+1F550-U+1F567,U+1F56F-U+1F570,U+1F573-U+1F57A,U+1F587,U+1F58A-U+1F58D,U+1F590,U+1F595-U+1F596,U+1F5A4-U+1F5A5,U+1F5A8,U+1F5B1-U+1F5B2,U+1F5BC,U+1F5C2-U+1F5C4,U+1F5D1-U+1F5D3,U+1F5DC-U+1F5DE,U+1F5E1,U+1F5E3,U+1F5E8,U+1F5EF,U+1F5F3,U+1F5FA-U+1F64F,U+1F680-U+1F6C5,U+1F6CB-U+1F6D2,U+1F6D5-U+1F6D7,U+1F6DC-U+1F6E5,U+1F6E9,U+1F6EB-U+1F6EC,U+1F6F0,U+1F6F3-U+1F6FC,U+1F7E0-U+1F7EB,U+1F7F0,U+1F90C-U+1F93A,U+1F93C-U+1F945,U+1F947-U+1F9FF,U+1FA70-U+1FA7C,U+1FA80-U+1FA88,U+1FA90-U+1FABD,U+1FABF-U+1FAC5,U+1FACE-U+1FADB,U+1FAE0-U+1FAE8,U+1FAF0-U+1FAF8 Noto Emoji

# Window
window_padding_width 8
hide_window_decorations yes

# Cursor
cursor_trail            3
cursor_trail_decay      0.1 0.4

# Tab bar
tab_bar_edge            top
tab_bar_style           fade
tab_fade                0 1
tab_bar_min_tabs        1
tab_title_template      " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# URL handling
open_url_with default
url_style curly
detect_urls yes

include colors.conf
