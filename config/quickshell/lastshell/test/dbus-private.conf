<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Session bus for the test harness (LASTSHELL_PRIVATE_BUS=1). No service
     directories, on purpose: nothing can be activated on it. A stock private
     bus activates xdg-desktop-portal the moment Qt asks for it, and that
     second xdg-document-portal remounts $XDG_RUNTIME_DIR/doc, killing the
     live session's. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
