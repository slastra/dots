# Vague on black, mapped onto the old palette names. Hand-maintained.

palette = "rose_pine"

[character]
success_symbol = "[🏠 ](mauve)"
error_symbol = "[🏠 ](red)"
vimcmd_symbol = "[🏠 ](green)"

[username]
style_user = "bold maroon"
show_always = true

[time]
time_format = "%H:%M"
format = "$time($style) "
style = "mauve"
disabled = false

[hostname]
ssh_only = false
format = "[$hostname ]($style)"
style ="bold pink"
trim_at = "."
disabled = false

[directory]
truncation_length = 4
style = "bold lavender"

[palettes.rose_pine]
# The palette keeps its old name and key names so the modules above need not
# change; the values between the markers are written by `tint apply`.
# tint:begin
rosewater = "#BEBEDA"
flamingo = "#BB9DBD"
pink = "#BB9DBD"
mauve = "#BB9DBD"
red = "#D8647E"
maroon = "#D8647E"
peach = "#F3BE7C"
yellow = "#F3BE7C"
green = "#99B782"
teal = "#BEBEDA"
sky = "#99B782"
sapphire = "#6E94B2"
blue = "#6E94B2"
lavender = "#BB9DBD"
text = "#CDCDCD"
subtext1 = "#CDCDCD"
subtext0 = "#CDCDCD"
overlay2 = "#606079"
overlay1 = "#606079"
overlay0 = "#606079"
surface2 = "#121212"
surface1 = "#121212"
surface0 = "#121212"
base = "#000000"
mantle = "#000000"
crust = "#000000"
# tint:end
