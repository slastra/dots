# {{name}}, for the keyboard. Written by `tint apply` from
# ~/.config/tint/templates/keyglow-colors.conf. LEDs wash out low-saturation
# colours, so each one keeps its hue at a deeper saturation (the `led` filter).
[Service]
ExecStart=
ExecStart=%h/go/bin/keyglow -base {{color4|led|bare}} -hit {{color1|led|bare}} -ripple {{color5|led|bare}} -playing {{color3|led|bare}} -paused {{color5|led|bare}} -bind {{accent|bare}} -volume {{color2|led|bare}} -caps {{color3|led|bare}}
