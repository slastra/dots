# Every timeout goes through presence-guard.sh: while deskpresence's ToF
# sensor sees someone at the laptop, input-idle is not idle and nothing
# fires. With the daemon down or its sensor quiet, these run as plain
# hypridle. DPMS goes through laptop-screen.sh because the Lua config
# rejects the old `hyprctl dispatch dpms off` form.

$guard = ~/.config/hypr/scripts/presence-guard.sh
$screen = ~/.config/hypr/scripts/laptop-screen.sh
$dp = /home/shaun/go/bin/deskpresence

general {
    lock_cmd = hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock &
    after_sleep_cmd = $screen on
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 120                           # 2 min: backlight to minimum (not 0)
    on-timeout = $guard timeout dim 'brillo -O && brillo -S 1 -u 600000'
    on-resume = $guard resume dim 'brillo -I -u 200000'
}

listener {
    timeout = 330                           # 5.5 min: panel and keyboard backlight off
    on-timeout = $guard timeout dpms '$screen off'
    on-resume = $guard resume dpms '$screen on'
}

listener {
    timeout = 600                           # 10 min: suspend
    on-timeout = $guard timeout suspend 'systemctl suspend'
}

# Input idle for deskpresence (2026-10-08), as on the desk: input within 20 s
# counts as present whatever the ToF says, and holds the dim at zero, so a
# keypress or a mouse nudge breaks out of the fade. Under the 30 s away timer
# so input touched just before leaving cannot hold the screen on. These
# ignore inhibitors: they report input, they do not act.
listener {
    timeout = 20
    ignore_inhibit = true
    on-timeout = $dp input quiet
    # unblank: lastshell's blackout shader, should the shell be gone
    on-resume = $dp input active; /home/shaun/.config/hypr/scripts/unblank.sh
}

listener {
    timeout = 600
    ignore_inhibit = true
    on-timeout = $dp input idle
    on-resume = $dp input active
}

listener {
    timeout = 3600
    ignore_inhibit = true
    on-timeout = $dp input away
    on-resume = $dp input active
}
