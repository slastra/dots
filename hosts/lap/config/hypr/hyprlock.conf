# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    # contrast = 1
    # brightness = 1
    # vibrancy = 0.2
    # vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 600, 100
    outline_thickness = 2
    dots_size = 0.6 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(235, 188, 186)
    inner_color = rgba(38, 35, 58, 0.6)
    font_color = rgb(224, 222, 244)
    fade_on_empty = false
    rounding = -1
    placeholder_text = <span foreground="##e0def4">Password</span>
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
    check_color = rgb(110, 106, 134)
    fail_color = rgb(235, 111, 146) # if authentication failed, changes outer_color and fail message color
    fail_text =  <b>$ATTEMPTS</b> # can be set to empty
    fail_timeout = 2000 # milliseconds before fail_text and fail_color disappears
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
}

# DATE
label {
  monitor =
  text = cmd[update:1000] date +"%A, %B %d"
  color = rgb(224, 222, 244)
  font_size = 40
  font_family = Share Tech
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000]  date +"%-I:%M"
  color = rgb(224, 222, 244)
  font_size = 256
  font_family = Share Tech Bold
  position = 0, 50
  halign = center
  valign = center
}

# FINGERPRINT
# hyprlock talks to fprintd itself (not via PAM), so the scan restarts after
# resume and runs alongside the password field. /etc/pam.d/hyprlock must then
# skip pam_fprintd (auth include system-login) or the two fight over the reader.
auth {
    fingerprint:enabled = true
    fingerprint:ready_message = touch the sensor
    fingerprint:present_message = scanning…
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(156, 207, 216)
    font_size = 18
    font_family = Share Tech
    position = 0, -300
    halign = center
    valign = center
}
