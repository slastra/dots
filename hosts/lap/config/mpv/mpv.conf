# Battery-efficient playback on lap (measured 2026-10-11).

# GPU decode, cheap scaling. OpenGL rather than Vulkan: mpv's Vulkan swapchain
# has an alpha channel, so Hyprland treats the window as not opaque and won't
# scan it out directly; with OpenGL a fullscreen window skips compositing.
hwdec=vaapi
vo=gpu-next
gpu-api=opengl
profile=fast

# YouTube: 1080p SDR. HDR streams cost ~4x the GPU work for tone mapping.
ytdl-format=bv*[height<=1080][dynamic_range=SDR]+ba/b[height<=1080]/b

# Download far ahead in big bursts so Wi-Fi can sleep between them
# (streaming cost ~1.2 W over playing a local file).
cache=yes
demuxer-max-bytes=512MiB
demuxer-readahead-secs=600
