# A clean stop (power-watch.sh on battery, eco.sh) brings the still wallpaper
# up (wallpaper-still.service); a crash leaves the restart alone, and nothing
# starts once Hyprland is gone.
[Service]
ExecStopPost=/bin/sh -c '[ "$SERVICE_RESULT" = success ] && pgrep -x Hyprland >/dev/null && systemctl --user start --no-block wallpaper-still.service || true'
